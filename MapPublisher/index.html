<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ハイキングマップデータの公開</title>
    <link rel="icon"
        href="data:image/svg+xml,
            <svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📤</text></svg>" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" />
    <link rel="stylesheet" href="styles.css" />
</head>

<body>
    <div id="map"></div>

    <div class="control-panel">
        <div class="panel-header">
            <span class="panel-title">ハイキングマップデータの公開</span>
            <span class="panel-version" id="appVersion"></span>
        </div>

        <!-- 公開するデータセット。見出しをクリックして開閉する。
             同じ name を持つ <details> は1つだけ開くため、操作の焦点は常に1つに絞られる。

             起動時はどれも開かない。まず「現在公開中」で3つの版を見渡し、
             作業するデータセットだけを開く流れにする（「現在公開中」を見出しに置くのはこのため。
             ↻ は3つ分をまとめて取得するので、1つしか見えないと結果を確かめられない）。

             並び順は更新頻度の高い順（通行止め → ハイキングマップ → 地図タイル）。

             開閉は地図の表示とは無関係。地図に出す・出さないは各データセットの
             「地図に表示」に任せる（通行止め地点をハイキングマップデータに重ねて確かめられるように）。 -->

        <!-- 通行止め・通行困難地点 -->
        <details class="panel-section" name="dataset">
            <summary class="section-head">
                <span class="section-title">通行止め・通行困難地点</span>
                <span class="published-row">
                    <span class="label">現在公開中</span>
                    <input type="text" class="text-input" id="closurePublished" readonly>
                </span>
            </summary>

            <div class="section-body">
                <div class="row">
                    <label for="closureFileInput" class="file-input-label">ファイル読み込み</label>
                    <input type="file" id="closureFileInput" accept=".geojson,.json">
                    <button id="clearClosureBtn">消去</button>
                </div>

                <div class="row">
                    <label class="check-label">
                        <input type="checkbox" id="closureVisible" checked>
                        <span>地図に表示</span>
                    </label>
                </div>

                <div class="summary" id="closureCounts">未読み込み</div>
                <div class="summary-note" id="closureNote"></div>

                <div class="row">
                    <span class="label">公開バージョン</span>
                    <input type="text" class="text-input" id="closureVersion"
                        placeholder="2026.01" autocomplete="off">
                </div>

                <div class="row button-row">
                    <button class="action-btn publish-btn" id="publishClosureBtn">公開</button>
                    <button id="exportClosureBtn">公開済みデータを出力</button>
                </div>
            </div>
        </details>

        <!-- ハイキングマップデータ（ポイント・ルート・スポット） -->
        <details class="panel-section" name="dataset">
            <summary class="section-head">
                <span class="section-title">ハイキングマップデータ</span>
                <span class="published-row">
                    <span class="label">現在公開中</span>
                    <input type="text" class="text-input" id="mapDataPublished" readonly>
                </span>
            </summary>

            <div class="section-body">
                <div class="row">
                    <label for="mapDataFileInput" class="file-input-label">ファイル読み込み</label>
                    <input type="file" id="mapDataFileInput" accept=".geojson,.json">
                    <button id="clearMapDataBtn">消去</button>
                </div>

                <div class="row">
                    <label class="check-label">
                        <input type="checkbox" id="mapDataVisible" checked>
                        <span>地図に表示</span>
                    </label>
                </div>

                <div class="summary" id="mapDataCounts">未読み込み</div>
                <div class="summary-note" id="mapDataExcluded"></div>

                <div class="row">
                    <span class="label">公開バージョン</span>
                    <input type="text" class="text-input" id="mapDataVersion"
                        placeholder="2026.01" autocomplete="off">
                </div>

                <div class="row button-row">
                    <button class="action-btn publish-btn" id="publishMapDataBtn">公開</button>
                    <button id="exportMapDataBtn">公開済みデータを出力</button>
                </div>
            </div>
        </details>

        <!-- 地図タイルのダウンロード領域（DownloadArea が出力した tile_manifest.json）
             タイル一覧は地点でもルートでもないため「地図に表示」は持たない -->
        <details class="panel-section" name="dataset">
            <summary class="section-head">
                <span class="section-title">地図タイルのダウンロード領域</span>
                <span class="published-row">
                    <span class="label">現在公開中</span>
                    <input type="text" class="text-input" id="tilePublished" readonly>
                </span>
            </summary>

            <div class="section-body">
                <div class="row">
                    <label for="tileFileInput" class="file-input-label">ファイル読み込み</label>
                    <input type="file" id="tileFileInput" accept=".json">
                    <button id="clearTileBtn">消去</button>
                </div>

                <div class="summary" id="tileCounts">未読み込み</div>

                <div class="row">
                    <span class="label">公開バージョン</span>
                    <input type="text" class="text-input" id="tileVersion"
                        placeholder="2026.01" autocomplete="off">
                </div>

                <div class="row button-row">
                    <button class="action-btn publish-btn" id="publishTileBtn">公開</button>
                    <button id="exportTileBtn">公開済みデータを出力</button>
                </div>
            </div>
        </details>

        <div class="row button-row panel-footer">
            <button class="reset-btn" id="reloadPublishedBtn" title="現在公開中の情報を取得">↻</button>
            <button id="clearTokenBtn">トークン消去</button>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
    <script type="module" src="js/app.js"></script>
</body>

</html>
