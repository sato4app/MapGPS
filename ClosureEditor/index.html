<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>通行止め・通行困難地点の登録と公開</title>
    <link rel="icon"
        href="data:image/svg+xml,
            <svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚧</text></svg>" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" />
    <link rel="stylesheet" href="styles.css" />
</head>

<body>
    <div id="map"></div>

    <div class="control-panel">
        <div class="panel-header">
            <span class="panel-title">通行止め・通行困難地点</span>
            <span class="panel-version" id="appVersion"></span>
        </div>

        <!-- 背景（ハイキングマップ） -->
        <section class="panel-section">
            <div class="section-title">ハイキングマップ（背景）</div>

            <div class="row">
                <label for="basemapFileInput" class="file-input-label">ファイル読み込み</label>
                <input type="file" id="basemapFileInput" accept=".geojson,.json" multiple>
                <button id="clearBasemapBtn">消去</button>
            </div>

            <div class="row">
                <label class="check-label">
                    <input type="checkbox" id="basemapVisible" checked>
                    <span>地図に表示</span>
                </label>
                <span class="hint" id="basemapSummary">未読み込み</span>
            </div>
        </section>

        <!-- 登録地点 -->
        <section class="panel-section">
            <div class="section-title">登録地点</div>

            <div class="row">
                <label for="closureFileInput" class="file-input-label">ファイル読み込み</label>
                <input type="file" id="closureFileInput" accept=".geojson,.json" multiple>
                <button id="exportClosureBtn">ファイル出力</button>
            </div>

            <div class="row">
                <span class="label">登録地点数</span>
                <input type="text" class="count-input" id="closureCountDisplay" readonly>
                <span class="hint" id="closureBreakdown">通行止め 0 / 通行困難 0</span>
            </div>

            <div class="row">
                <span class="label">登録地点</span>
                <select class="dropdown" id="closureSelect">
                    <option value="">選択してください</option>
                </select>
            </div>

            <div class="row">
                <span class="label">選択地点</span>
                <input type="text" class="text-input" id="selectedClosureName">
            </div>

            <div class="row">
                <span class="label">備考</span>
                <input type="text" class="text-input" id="closureNote">
            </div>

            <div class="row radio-row">
                <span class="label">区分</span>
                <label class="radio-label">
                    <input type="radio" name="closureKind" value="closed">
                    <span>通行止め</span>
                </label>
                <label class="radio-label">
                    <input type="radio" name="closureKind" value="difficult">
                    <span>通行困難</span>
                </label>
            </div>

            <div class="row radio-row">
                <span class="label">登録理由</span>
                <label class="radio-label">
                    <input type="radio" name="closureReason" value="工事">
                    <span>工事</span>
                </label>
                <label class="radio-label">
                    <input type="radio" name="closureReason" value="倒木">
                    <span>倒木</span>
                </label>
                <label class="radio-label">
                    <input type="radio" name="closureReason" value="落石">
                    <span>落石</span>
                </label>
                <label class="radio-label">
                    <input type="radio" name="closureReason" value="">
                    <span>なし</span>
                </label>
            </div>

            <div class="row button-row">
                <button class="action-btn" id="addMoveClosureBtn">追加・移動</button>
                <button class="action-btn" id="deleteClosureBtn">削除</button>
            </div>
        </section>

        <!-- 公開 -->
        <section class="panel-section">
            <div class="section-title">公開</div>

            <div class="row">
                <span class="label">バージョン</span>
                <input type="text" class="text-input" id="closureVersionInput" placeholder="例: 2026-07-28.1">
            </div>

            <div class="row">
                <span class="label">現在公開中</span>
                <input type="text" class="text-input" id="publishedVersionDisplay" readonly>
                <button class="reset-btn" id="reloadPublishedBtn" title="現在公開中のバージョンを取得">↻</button>
            </div>

            <div class="row button-row">
                <button class="action-btn publish-btn" id="publishBtn">公開</button>
                <button class="action-btn" id="clearTokenBtn">トークン消去</button>
            </div>
        </section>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
    <script type="module" src="js/app.js"></script>
</body>

</html>
